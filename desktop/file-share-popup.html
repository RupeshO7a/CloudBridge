<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBridge - Share File</title>

    <style>
        :root {
            --peach: #F6DBC0;
            --cream: #F8F4E9;
            --muted: #D8C6D8;
            --rose: #935073;
            --bg: #17101C;
            --panel: #211625;
            --card: #302238;
            --line: rgba(248, 244, 233, .14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            padding: 11px;
            color: var(--cream);
            background:
                radial-gradient(circle at top right,
                    rgba(147, 80, 115, .18), transparent 48%),
                var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .popup {
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--rose), #502D55);
            color: var(--peach);
            font-size: 19px;
        }

        .brand-name {
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: bold;
        }

        .brand-tagline {
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: #D99CBE;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.6px;
        }

        .content-card {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: linear-gradient(145deg, var(--card), var(--panel));
        }

        .field {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--cream);
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            background: var(--bg);
            color: var(--cream);
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 13px;
        }

        input:focus,
        select:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 2px rgba(147, 80, 115, .15);
        }

        input::placeholder {
            color: #A18DA5;
        }

        select {
            cursor: pointer;
        }

        .file-box {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 53px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
        }

        .file-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 8px;
            background: rgba(147, 80, 115, .2);
            color: var(--peach);
            font-size: 18px;
        }

        #fileName {
            min-width: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            width: 100%;
            min-height: 38px;
            padding: 10px;
            border-radius: 8px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }

        #chooseBtn {
            border: 1px solid rgba(147, 80, 115, .45);
            background: rgba(147, 80, 115, .17);
            color: var(--cream);
        }

        #chooseBtn:hover {
            background: rgba(147, 80, 115, .32);
        }

        #sendFileBtn {
            border: none;
            background: var(--peach);
            color: #281B30;
        }

        #sendFileBtn:hover:not(:disabled) {
            background: #FFE7D1;
        }

        #closeBtn {
            border: 1px solid var(--line);
            background: rgba(147, 80, 115, .12);
            color: var(--cream);
        }

        #closeBtn:hover {
            background: rgba(147, 80, 115, .3);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            min-height: 0;
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <main class="popup">

        <div class="brand">
            <div class="brand-icon">☁</div>
            <div>
                <div class="brand-name">CloudBridge</div>
                <div class="brand-tagline">Your devices, connected.</div>
            </div>
        </div>

        <div class="eyebrow">QUICK TRANSFER</div>

        <section class="content-card">

            <div class="field">
                <label for="recipient">Recipient email</label>
                <input id="recipient" type="email" placeholder="recipient@example.com">
            </div>

            <div class="field">
                <label>Selected file</label>
                <div class="file-box">
                    <div class="file-icon">▧</div>
                    <div id="fileName">No file selected</div>
                </div>
            </div>

            <div class="field">
                <button id="chooseBtn">Choose File +</button>
            </div>

            <div class="field">
                <label for="expires">Link expiry</label>
                <select id="expires">
                    <option value="1">1 hour</option>
                    <option value="6">6 hours</option>
                    <option value="24" selected>24 hours</option>
                    <option value="72">3 days</option>
                    <option value="168">7 days</option>
                </select>
            </div>

            <div class="actions">
                <button id="sendFileBtn" disabled>Send File ↗</button>
                <button id="closeBtn">Cancel</button>
            </div>

            <p id="status" role="status"></p>

        </section>

    </main>

    <script src="./file-share-popup-renderer.js"></script>

</body>

</html>
