
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CloudBridge - Share File</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #1e293b;
            color: white;
            padding: 18px;
            margin: 0;
        }

        h2 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            color: #94a3b8;
            font-size: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #chooseBtn {
            background: #0d9488;
            color: white;
        }

        #sendFileBtn {
            background: #6366f1;
            color: white;
        }

        #closeBtn {
            background: #334155;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #fileName {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            overflow-wrap: anywhere;
            color: #cbd5e1;
            min-height: 36px;
        }

        #status {
            overflow-wrap: anywhere;
            color: #cbd5e1;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Share a File</h2>

    <p>Select a file and securely share it with another CloudBridge user.</p>

    <label for="recipient">Recipient email</label>
    <input
        id="recipient"
        type="email"
        placeholder="recipient@example.com"
    >

    <button id="chooseBtn">Choose File</button>

    <label>Selected file</label>
    <div id="fileName">No file selected</div>

    <label for="expires">Link expiry</label>
    <select id="expires">
        <option value="1">1 hour</option>
        <option value="6">6 hours</option>
        <option value="24" selected>24 hours</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
    </select>

    <button id="sendFileBtn" disabled>Send File</button>

    <button id="closeBtn">Close</button>

    <p id="status" role="status"></p>

    <script src="./file-share-popup-renderer.js"></script>

</body>
</html>
