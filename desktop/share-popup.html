<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>CloudBridge Share</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #1e293b;
            color: white;
            padding: 18px;
            margin: 0;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        h3 {
            color: #38bdf8;
            margin: 0 0 10px;
            font-size: 15px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .section {
            background: #0f172a;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 13px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin: 10px 0 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font: inherit;
        }

        textarea {
            height: 65px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send {
            background: #6366f1;
            color: white;
        }

        .file {
            background: #0d9488;
            color: white;
        }

        .ignore {
            background: #334155;
            color: white;
        }

        .file-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        #status {
            font-size: 12px;
            margin-top: 10px;
            color: #cbd5e1;
            overflow-wrap: anywhere;
        }

        .expiry {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <h2>CloudBridge Share</h2>

    <p class="subtitle">
        Share text and files securely with another CloudBridge user.
    </p>

    <!-- TEXT SHARING -->

    <div class="section">
        <h3>1. Share Text / URL</h3>

        <label for="preview">Clipboard content</label>
        <textarea id="preview" readonly></textarea>

        <label for="recipient">Text recipient email</label>
        <input id="recipient" type="email" placeholder="text-recipient@example.com" />

        <button class="send" id="sendBtn">
            Send Text
        </button>
    </div>

    <!-- FILE SHARING -->

    <div class="section">
        <h3>2. Share File</h3>

        <label for="fileRecipient">File recipient email</label>
        <input id="fileRecipient" type="email" placeholder="file-recipient@example.com" />

        <button class="file" id="fileBtn" type="button">
            Choose File
        </button>

        <p class="file-info" id="fileName">
            No file selected
        </p>

        <button class="send" id="sendFileBtn" type="button" disabled>
            Send File
        </button>
    </div>

    <!-- COMMON EXPIRY -->

    <label for="expires">Link expiry</label>
    <select id="expires" class="expiry">
        <option value="1">Expires in 1 hour</option>
        <option value="6">Expires in 6 hours</option>
        <option value="24" selected>Expires in 24 hours</option>
        <option value="72">Expires in 3 days</option>
        <option value="168">Expires in 7 days</option>
    </select>

    <button class="ignore" id="ignoreBtn">
        Close
    </button>

    <p id="status" role="status"></p>

    <script src="./share-popup-renderer.js"></script>

</body>

</html>
