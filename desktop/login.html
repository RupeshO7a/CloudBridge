<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudBridge</title>

  <style>
    :root {
      --violet: #502D55;
      --rose: #935073;
      --peach: #F6DBC0;
      --cream: #F8F4E9;
      --muted: #D8C6D8;
      --border: rgba(248, 244, 233, 0.17);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 10% 20%, rgba(147, 80, 115, .38), transparent 48%),
        radial-gradient(ellipse at 90% 85%, rgba(80, 45, 85, .65), transparent 50%),
        linear-gradient(145deg, #251829, #170F1C 75%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    body::before {
      width: 230px;
      height: 230px;
      top: -125px;
      right: -90px;
      background: rgba(147, 80, 115, .12);
    }

    body::after {
      width: 190px;
      height: 190px;
      bottom: -110px;
      left: -80px;
      background: rgba(246, 219, 192, .07);
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BRAND */

    .brand {
      text-align: center;
      margin-bottom: 27px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 19px;
      background: linear-gradient(145deg, var(--rose), var(--violet));
      border: 1px solid rgba(248, 244, 233, .28);
      box-shadow: 0 9px 28px rgba(147, 80, 115, .30);
      font-size: 29px;
      font-weight: 750;
    }

    .brand h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -1px;
      font-weight: 750;
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .15px;
    }

    /* LOGIN CARD */

    .login-card {
      width: 100%;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: rgba(80, 45, 85, .31);
      backdrop-filter: blur(20px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
    }

    .welcome {
      margin-bottom: 22px;
    }

    .welcome h2 {
      margin: 0 0 7px;
      font-size: 23px;
      font-weight: 650;
    }

    .welcome p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* BUTTONS */

    button,
    input {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
    }

    button {
      height: 47px;
      border-radius: 11px;
      border: none;
      cursor: pointer;
      font-weight: 650;
      transition: .2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #googleBtn {
      color: var(--cream);
      background: rgba(147, 80, 115, .27);
      border: 1px solid rgba(248, 244, 233, .23);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
    }

    #googleBtn:hover:not(:disabled) {
      background: rgba(147, 80, 115, .43);
    }

    .google-logo {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    #loginBtn {
      margin-top: 5px;
      color: #28192B;
      background: linear-gradient(100deg, var(--peach), var(--cream));
      box-shadow: 0 5px 18px rgba(147, 80, 115, .18);
    }

    #loginBtn:hover:not(:disabled) {
      background: var(--cream);
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 19px 0;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.1px;
      white-space: nowrap;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* INPUTS */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    input {
      height: 45px;
      padding: 0 14px;
      outline: none;
      color: var(--cream);
      background: rgba(248, 244, 233, .07);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: .2s ease;
    }

    input::placeholder {
      color: rgba(248, 244, 233, .48);
    }

    input:focus {
      border-color: var(--peach);
      background: rgba(248, 244, 233, .10);
    }

    /* OTHER SIGN-IN LOGOS */

    .social-login {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin-top: 17px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 11px;
      border: 1px solid rgba(248, 244, 233, .18);
      background: rgba(248, 244, 233, .07);
      color: var(--cream);
      cursor: default;
      padding: 0;
    }

    .social-icon:disabled {
      opacity: .85;
    }

    .social-icon svg {
      display: block;
    }

    .yahoo-logo {
      font-size: 21px;
      font-weight: 800;
      color: #B78AFF;
      letter-spacing: -1px;
    }

    /* FEEDBACK */

    #status,
    #error {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #status {
      color: var(--peach);
    }

    #error {
      color: #FFAAAA;
    }

    /* FOOTER */

    .footer {
      margin-top: 19px;
      text-align: center;
      font-size: 10px;
      color: rgba(248, 244, 233, .58);
    }

    /* SMALL WINDOW FALLBACK */

    @media (max-height: 650px) {
      body {
        padding: 12px;
      }

      .brand {
        margin-bottom: 14px;
      }

      .logo {
        width: 43px;
        height: 43px;
        font-size: 23px;
        margin-bottom: 6px;
      }

      .brand h1 {
        font-size: 25px;
      }

      .brand p {
        margin-top: 4px;
      }

      .login-card {
        padding: 20px 24px;
      }

      .welcome {
        margin-bottom: 13px;
      }

      .welcome h2 {
        font-size: 20px;
      }

      .divider {
        margin: 12px 0;
      }

      .field {
        margin-bottom: 11px;
      }

      input,
      button {
        height: 40px;
      }

      .social-icon {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .social-login {
        gap: 9px;
        margin-top: 12px;
      }

      .footer {
        margin-top: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="brand">
      <div class="logo">C</div>
      <h1>CloudBridge</h1>
      <p>Your files. Your devices. One connection.</p>
    </header>

    <section class="login-card">

      <div class="welcome">
        <h2>Welcome back</h2>
        <p>Sign in to continue to your workspace.</p>
      </div>

      <!-- FUNCTIONAL GOOGLE SIGN-IN -->

      <button id="googleBtn" type="button">

        <!-- Google multicolour G logo -->

        <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4"
            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.9 6-15z" />
          <path fill="#34A853"
            d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44z" />
          <path fill="#FBBC05" d="M12.8 27.7a12 12 0 0 1 0-7.4V15H5.9a20 20 0 0 0 0 18z" />
          <path fill="#EA4335"
            d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.3c1.6-4.7 6-8.2 11.2-8.2z" />
        </svg>

        Continue with Google

      </button>

      <!-- DECORATIVE SIGN-IN OPTIONS (NOT FUNCTIONAL YET) -->

      <div class="social-login">

        <!-- GitHub -->

        <button class="social-icon" type="button" title="GitHub" disabled>
          <svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor">
            <path
              d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.8-5.5 6.1.4.3.8 1 .8 2v3c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9z" />
          </svg>
        </button>

        <!-- Apple -->

        <button class="social-icon" type="button" title="Apple" disabled>
          <svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor">
            <path
              d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5a4.4 4.4 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.7.9s-2-.9-3.3-.9a4.9 4.9 0 0 0-4.1 2.5c-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.5 3.2 2.4 1.3-.1 1.8-.8 3.4-.8s2 .8 3.4.8 2.3-1.2 3.2-2.5a10.8 10.8 0 0 0 1.5-2.9 4.3 4.3 0 0 1-3.4-4.2zM14 5.8a4.3 4.3 0 0 0 1-3.1 4.4 4.4 0 0 0-2.9 1.5 4.1 4.1 0 0 0-1 3 3.7 3.7 0 0 0 2.9-1.4z" />
          </svg>
        </button>

        <!-- Microsoft -->

        <button class="social-icon" type="button" title="Microsoft" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#F25022" d="M2 2h9v9H2z" />
            <path fill="#7FBA00" d="M13 2h9v9h-9z" />
            <path fill="#00A4EF" d="M2 13h9v9H2z" />
            <path fill="#FFB900" d="M13 13h9v9h-9z" />
          </svg>
        </button>

        <!-- Phone -->

        <button class="social-icon" type="button" title="Phone" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2.5" />
            <path d="M9 5h6M11 18h2" />
          </svg>
        </button>

        <!-- Yahoo -->

        <button class="social-icon" type="button" title="Yahoo" disabled>
          <span class="yahoo-logo">Y!</span>
        </button>

      </div>

      <div class="divider">
        OR CONTINUE WITH EMAIL
      </div>

      <!-- EMAIL LOGIN -->

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button id="loginBtn" type="button">
        Sign in
      </button>

      <p id="status" role="status"></p>
      <p id="error" role="alert"></p>

    </section>

    <footer class="footer">
      Securely connected. Seamlessly shared.
    </footer>

  </main>

  <script src="./login-renderer.js"></script>

</body>

</html>
