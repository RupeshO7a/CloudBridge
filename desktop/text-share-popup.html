
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CloudBridge - Share Text</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #1e293b;
            color: white;
            padding: 18px;
            margin: 0;
        }

        h2 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            color: #94a3b8;
            font-size: 12px;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            margin-top: 6px;
            font: inherit;
        }

        textarea {
            height: 110px;
            resize: vertical;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            font-size: 12px;
            margin-top: 14px;
        }

        select {
            width: 100%;
            padding: 9px;
            margin-top: 6px;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #sendBtn {
            background: #6366f1;
            color: white;
        }

        #closeBtn {
            background: #334155;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            overflow-wrap: anywhere;
            color: #cbd5e1;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Share Text / URL</h2>

    <p>CloudBridge detected new clipboard content.</p>

    <label for="preview">Clipboard preview</label>
    <textarea id="preview" readonly></textarea>

    <label for="recipient">Recipient email</label>
    <input
        id="recipient"
        type="email"
        placeholder="recipient@example.com"
    >

    <label for="expires">Link expiry</label>
    <select id="expires">
        <option value="1">1 hour</option>
        <option value="6">6 hours</option>
        <option value="24" selected>24 hours</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
    </select>

    <button id="sendBtn">Send Text</button>
    <button id="closeBtn">Close</button>

    <p id="status" role="status"></p>

    <script src="./text-share-popup-renderer.js"></script>

</body>
</html>
